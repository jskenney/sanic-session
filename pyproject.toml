[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sanic-session"
version = "0.10.0"
description = "Server-backed sessions for Sanic, stored in memcached or in memory."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "FLASK_LICENSE"]
authors = [
    { name = "Suby Raman" },
    { name = "Mikhail Kashkin" },
    { name = "Adam Hopkins" },
    { name = "J. Kenney" },
]
requires-python = ">=3.10"
dependencies = ["sanic>=23.3"]
keywords = ["sessions", "sanic", "memcache"]
classifiers = [
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Session",
]

[project.optional-dependencies]
aiomcache = ["aiomcache>=0.8"]
dev = [
    "aiomcache>=0.8",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "sanic-testing",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/jskenney/sanic-session"
Upstream = "https://github.com/ahopkins/sanic-session"

[tool.setuptools]
packages = ["sanic_session"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
